name: 'Load Secrets from Proton Pass'
description: 'Load secrets from Proton Pass vaults into GitHub Actions workflows using pass:// URIs'
author: 'Gizmodlabs LLC'

branding:
  icon: 'lock'
  color: 'purple'

inputs:
  personal-access-token:
    description: 'Proton Pass Personal Access Token (`pst_xxxx::TOKENKEY`, from `pass-cli pat create`). Optional when the step sets the PROTON_PASS_PERSONAL_ACCESS_TOKEN environment variable instead (compatible with protonpass/load-secret-action).'
    required: false
  env-template:
    description: 'Path to .env template file with pass:// references to inject'
    required: false
    default: ''
  pass-cli-version:
    description: 'pass-cli version to install: MAJOR.MINOR.PATCH or `latest`. Leave empty (default) to install 2.3.3, or to accept any pass-cli already on PATH (e.g. from protonpass/install-cli-action). An explicit version is enforced: a different pre-installed pass-cli is replaced. Versions before 2.1.2 are not available.'
    required: false
    default: ''
  hash:
    description: 'Expected SHA-256 (64 hex chars) of the downloaded pass-cli binary. When empty the hash is fetched from the official `.sha256` release asset. Verification is mandatory either way; a mismatch fails the step.'
    required: false
    default: ''
  platform:
    description: 'Target platform, auto-detected when empty. One of: linux-x86_64, linux-aarch64, macos-x86_64, macos-aarch64, windows-x86_64.'
    required: false
    default: ''
  mask-values:
    description: 'Mask resolved secret values in logs'
    required: false
    default: 'true'
  strict:
    description: 'Fail the step when any pass:// URI cannot be resolved (default). Set to false for best-effort mode: unresolved URIs are reported as warnings and skipped.'
    required: false
    default: 'true'
  output-path:
    description: 'Where to write the rendered template. Defaults to stripping .template/.tpl, else input+.resolved.'
    required: false
    default: ''
  export-env:
    description: 'Export resolved secrets as environment variables for subsequent steps (default). Set to false to expose them only as step outputs. Note: the upstream protonpass/load-secret-action defaults this to false; this action defaults to true to stay compatible with its own earlier releases.'
    required: false
    default: 'true'

outputs:
  resolved-keys:
    description: 'Comma-separated, sorted list of env var names the action populated. Names only — values never appear. Empty string when nothing resolved.'
  # In addition to resolved-keys, every resolved variable is exposed as its
  # own (masked) step output: steps.<id>.outputs.<NAME>.

runs:
  using: 'node24'
  main: 'dist/index.js'
  post: 'dist/cleanup.js'
