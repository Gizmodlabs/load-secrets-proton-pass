name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: 'Commit SHA or tag to validate'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Literal prefix, not github.workflow: when release.yml calls this workflow
  # that expands to the caller's name, shared with the e2e-real.yml call.
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # OS-independent checks run once: typecheck (TS7, --noEmit only), lint, the
  # unit coverage gate, and dist/ freshness (a committed build artifact that
  # must match src/, including files a build newly adds).
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - name: Fail when dist/ is stale
        run: |
          if [[ -n "$(git status --porcelain -- dist/)" ]]; then
            git status --porcelain -- dist/
            echo "::error::dist/ is stale. Run 'npm run build' and commit the result."
            exit 1
          fi

  # The node:test suites on every OS the action supports: unit tests import
  # src/, integration tests run the freshly built dist/ against the mock CLI.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test

  # The committed action (uses: ./, i.e. the checked-out dist/) run by the
  # real runner against the mock pass-cli: one job per OS, scenarios as steps.
  # Every scenario exports into the same job environment, so each uses its own
  # variable names. Later invocations also reuse the first one's session,
  # which exercises the PAT-fingerprint reuse path.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # Job-level so a later step can prove the action left it untouched.
      NORMAL_VAR: "not-a-secret"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install mock pass-cli
        run: node tests/fixtures/install-mock.mjs

      # Literal references: env vars, per-var step outputs, resolved-keys.
      - name: "literal: load secrets"
        id: literal
        uses: ./
        with:
          personal-access-token: "pst_mock::TOKENKEY"
          pass-cli-version: "1.0.0" # matches the mock's --version output
        env:
          DB_PASSWORD: "pass://GithubActions/load-secrets-proton-pass-test/Password"
          API_KEY: "pass://GithubActions/load-secrets-proton-pass-test/Email"

      # Values are exactly the stored bytes (the CLI's print newline is stripped).
      - name: "literal: verify env, outputs and resolved-keys"
        env:
          RESOLVED_KEYS: ${{ steps.literal.outputs.resolved-keys }}
          OUTPUT_DB_PASSWORD: ${{ steps.literal.outputs.DB_PASSWORD }}
        run: |
          [[ "$DB_PASSWORD" == "mock-real-password" ]] || { echo "FAIL: DB_PASSWORD mismatch"; exit 1; }
          [[ "$API_KEY" == "mock@example.com" ]] || { echo "FAIL: API_KEY mismatch"; exit 1; }
          [[ "$NORMAL_VAR" == "not-a-secret" ]] || { echo "FAIL: NORMAL_VAR modified"; exit 1; }
          [[ "$RESOLVED_KEYS" == "API_KEY,DB_PASSWORD" ]] || { echo "FAIL: resolved-keys was '$RESOLVED_KEYS'"; exit 1; }
          [[ "$RESOLVED_KEYS" != *"mock-real-password"* ]] || { echo "FAIL: secret value leaked into resolved-keys"; exit 1; }
          [[ "$OUTPUT_DB_PASSWORD" == "mock-real-password" ]] || { echo "FAIL: per-var step output missing"; exit 1; }

      - name: "literal: fail if contains() gating on resolved-keys does not match"
        if: ${{ !contains(steps.literal.outputs.resolved-keys, 'DB_PASSWORD') }}
        run: |
          echo "FAIL: contains() gate on DB_PASSWORD did not match"
          exit 1

      # Field glob. No pass-cli-version on purpose: exercises the "unset
      # accepts the pre-installed CLI" path (install-cli-action interop).
      - name: "glob: expand every field of an item"
        uses: ./
        with:
          personal-access-token: "pst_mock::TOKENKEY"
          mask-values: "false"
        env:
          GLOB: "pass://GithubActions/multi-field-item/*"

      - name: "glob: verify expanded env vars"
        run: |
          [[ "$GLOB_HOST" == "db.example.com" ]] || { echo "FAIL: GLOB_HOST='$GLOB_HOST'"; exit 1; }
          [[ "$GLOB_PORT" == "5432" ]] || { echo "FAIL: GLOB_PORT='$GLOB_PORT'"; exit 1; }
          [[ "$GLOB_PASSWORD" == "hunter2" ]] || { echo "FAIL: GLOB_PASSWORD='$GLOB_PASSWORD'"; exit 1; }

      # Step outputs only (export-env: false).
      - name: "outputs-only: load a glob without exporting env vars"
        id: outputs_only
        uses: ./
        with:
          personal-access-token: "pst_mock::TOKENKEY"
          export-env: "false"
          mask-values: "false"
        env:
          OUT: "pass://GithubActions/multi-field-item/*"

      - name: "outputs-only: verify outputs set and env untouched"
        env:
          OUT_HOST_OUTPUT: ${{ steps.outputs_only.outputs.OUT_HOST }}
          OUT_PORT_OUTPUT: ${{ steps.outputs_only.outputs.OUT_PORT }}
        run: |
          [[ -z "${OUT_HOST:-}" ]] || { echo "FAIL: OUT_HOST should not be exported"; exit 1; }
          [[ "$OUT_HOST_OUTPUT" == "db.example.com" ]] || { echo "FAIL: OUT_HOST output was '$OUT_HOST_OUTPUT'"; exit 1; }
          [[ "$OUT_PORT_OUTPUT" == "5432" ]] || { echo "FAIL: OUT_PORT output was '$OUT_PORT_OUTPUT'"; exit 1; }

      # Template injection with an explicit output-path.
      - name: "template: create template"
        run: |
          mkdir -p tests/.output
          cat > tests/.output/test.env.template <<'EOF'
          DB_PASSWORD={{ pass://GithubActions/load-secrets-proton-pass-test/Password }}
          EMAIL={{ pass://GithubActions/load-secrets-proton-pass-test/Email }}
          EOF

      - name: "template: render with explicit output-path"
        uses: ./
        with:
          personal-access-token: "pst_mock::TOKENKEY"
          env-template: "tests/.output/test.env.template"
          output-path: "tests/.output/.env.production"

      - name: "template: verify rendered file"
        run: |
          [[ -f tests/.output/.env.production ]] || { echo "FAIL: override path not created"; exit 1; }
          grep -q "DB_PASSWORD=mock-injected-value" tests/.output/.env.production || { echo "FAIL: DB_PASSWORD not injected"; exit 1; }
          grep -q "EMAIL=mock-injected-value" tests/.output/.env.production || { echo "FAIL: EMAIL not injected"; exit 1; }
          [[ ! -f tests/.output/test.env ]] || { echo "FAIL: auto-derived path written despite override"; exit 1; }

      # Multiline regression: an SSH-key style secret must reach later steps
      # intact through the runner's env file.
      - name: "multiline: load an SSH key"
        uses: ./
        with:
          personal-access-token: "pst_mock::TOKENKEY"
        env:
          SSH_KEY: "pass://GithubActions/ssh-key-item/private-key"

      - name: "multiline: verify the value is intact"
        run: |
          [[ "$SSH_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]] || { echo "FAIL: header missing"; exit 1; }
          [[ "$SSH_KEY" == *"END OPENSSH PRIVATE KEY-----"* ]] || { echo "FAIL: footer missing"; exit 1; }
          line_count=$(printf '%s' "$SSH_KEY" | wc -l | tr -d ' ')
          [[ "$line_count" -ge 3 ]] || { echo "FAIL: newlines lost (lines=$line_count)"; exit 1; }

  # Static analysis of the workflows themselves. actionlint validates syntax,
  # expressions and (via the runner image's shellcheck) run scripts; zizmor
  # audits for security issues. Per-variable outputs are dynamic, so
  # actionlint cannot know them from action.yml. Exceptions live in
  # .github/zizmor.yml.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: 1.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color \
            -ignore 'is not defined in object type \{resolved-keys: string\}' \
            .github/workflows/*.yml
      - name: zizmor
        run: pipx run --spec "zizmor==${ZIZMOR_VERSION}" zizmor --offline --no-progress .github/
