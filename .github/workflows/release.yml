name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)release (e.g. v1.1.0)'
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.name }}
      major: ${{ steps.tag.outputs.major }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable release commit
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$RELEASE_TAG' must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          sha="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          if [[ -z "$sha" ]]; then
            echo "Tag '$RELEASE_TAG' does not exist" >&2
            exit 1
          fi
          {
            echo "name=$RELEASE_TAG"
            echo "major=${RELEASE_TAG%%.*}"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

  validate-test:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  validate-e2e:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-real.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      require-pat: true
    secrets:
      PROTON_PASS_PERSONAL_ACCESS_TOKEN: ${{ secrets.PROTON_PASS_PERSONAL_ACCESS_TOKEN }}

  release:
    needs: [prepare, validate-test, validate-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and move the floating major tag
      id-token: write # sigstore keyless signing for the provenance attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      # No dependency cache in the job that publishes: a cache entry written
      # by any earlier run could otherwise feed the release build.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # Install scripts never run with this job's write token and OIDC access.
      - run: npm ci --ignore-scripts
      - name: Verify tag still targets the validated commit
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          [[ "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")" == "$RELEASE_SHA" ]] || {
            echo "::error::Release tag changed after validation."
            exit 1
          }
      - name: Verify committed bundles are fresh
        run: |
          npm run build
          git diff --exit-code -- dist/
      - name: Package action source
        id: pack
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          npm run release:package -- --tag "$RELEASE_TAG" --out-dir .release
          {
            echo "tarball=.release/load-secrets-proton-pass-${RELEASE_TAG}.tar.gz"
            echo "checksum=.release/load-secrets-proton-pass-${RELEASE_TAG}.tar.gz.sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Attest build provenance (sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          CHECKSUM: ${{ steps.pack.outputs.checksum }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --verify-tag \
            "$TARBALL" \
            "$CHECKSUM"
      - name: Move floating major tag
        env:
          GH_TOKEN: ${{ github.token }}
          MAJOR: ${{ needs.prepare.outputs.major }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR" "$RELEASE_TAG"
          # The checkout persists no credentials; only this push gets the token.
          git push "https://x-access-token:${GH_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" \
            "refs/tags/$MAJOR" --force
